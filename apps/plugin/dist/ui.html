<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>/* Figma supplies --figma-color-* when themeColors is on; the fallbacks are for a plain browser. */
:root {
  --bg: var(--figma-color-bg, #fff);
  --bg-2: var(--figma-color-bg-secondary, #f5f5f5);
  --bg-hover: var(--figma-color-bg-hover, #f0f0f0);
  --text: var(--figma-color-text, #1e1e1e);
  --text-2: var(--figma-color-text-secondary, #6b6b6b);
  --text-3: var(--figma-color-text-tertiary, #9a9a9a);
  --border: var(--figma-color-border, #e6e6e6);
  --brand: var(--figma-color-bg-brand, #0d99ff);
  --on-brand: var(--figma-color-text-onbrand, #fff);
  --brand-text: var(--figma-color-text-brand, #007be5);
  --danger: var(--figma-color-text-danger, #dc3412);
  --danger-bg: var(--figma-color-bg-danger-tertiary, #fff1ee);
  --warning: var(--figma-color-text-warning, #b86200);
  --success: var(--figma-color-text-success, #14ae5c);
  --success-bg: var(--figma-color-bg-success-tertiary, #ebfff0);
  --sev-critical: #e5484d;
  --sev-high: #f76b15;
  --sev-medium: #ffb224;
  --sev-low: #8e8c99;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font: 12px/1.45 Inter, system-ui, -apple-system, sans-serif;
}
button, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: 0.45; }
#app { display: flex; flex-direction: column; height: 100%; }

/* Header */
.top { display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 41px; border-bottom: 1px solid var(--border); flex: none; }
.brand { font-weight: 600; margin-right: auto; display: flex; align-items: center; gap: 6px; }
.brand-mark { width: 14px; height: 14px; border-radius: 4px; background: var(--brand); }
.tabs { display: flex; gap: 2px; }
.tab { border: 0; background: none; padding: 5px 9px; border-radius: 5px; color: var(--text-2); }
.tab[aria-selected="true"] { background: var(--bg-2); color: var(--text); font-weight: 500; }

.scroll { flex: 1; overflow-y: auto; }
.pad { padding: 12px; }
.muted { color: var(--text-2); }
.small { font-size: 11px; }
.section-label { font-size: 11px; font-weight: 500; color: var(--text-2); margin: 0 0 6px; }

/* Start */
.segmented { display: flex; background: var(--bg-2); border-radius: 6px; padding: 2px; margin-bottom: 12px; }
.segmented button { flex: 1; border: 0; background: none; padding: 5px; border-radius: 4px; color: var(--text-2); }
.segmented button[aria-pressed="true"] { background: var(--bg); color: var(--text); box-shadow: 0 0 0 1px var(--border); font-weight: 500; }
.selection-card { border: 1px solid var(--border); border-radius: 6px; padding: 10px; margin-bottom: 12px; }
.selection-card strong { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn { border: 1px solid var(--border); background: var(--bg); border-radius: 6px; padding: 6px 10px; }
.btn:hover:not(:disabled) { background: var(--bg-hover); }
.btn-primary { background: var(--brand); color: var(--on-brand); border-color: transparent; font-weight: 500; }
.btn-primary:hover:not(:disabled) { background: var(--brand); filter: brightness(1.08); }
.btn-block { width: 100%; padding: 8px; }
.btn-ghost { border-color: transparent; background: none; color: var(--text-2); }
.guide-note { display: flex; gap: 8px; margin-top: 12px; padding: 10px; background: var(--bg-2); border-radius: 6px; color: var(--text-2); font-size: 11px; }

/* Progress */
.progress { height: 4px; background: var(--bg-2); border-radius: 2px; overflow: hidden; margin: 8px 0; }
.progress > div { height: 100%; background: var(--brand); transition: width 0.15s; }

/* Summary */
.summary { padding: 12px 12px 8px; border-bottom: 1px solid var(--border); flex: none; }
.summary-head { display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; }
.summary-head h2 { font-size: 13px; margin: 0; font-weight: 600; }
.summary-head .btn { margin-left: auto; padding: 3px 8px; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { border: 1px solid var(--border); background: var(--bg); border-radius: 999px; padding: 2px 8px; font-size: 11px; display: inline-flex; align-items: center; gap: 5px; }
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block; }
.dot.critical { background: var(--sev-critical); }
.dot.high { background: var(--sev-high); }
.dot.medium { background: var(--sev-medium); }
.dot.low { background: var(--sev-low); }

/* Rows */
.row { border-bottom: 1px solid var(--border); }
.row-head { display: flex; gap: 8px; align-items: flex-start; width: 100%; text-align: left; border: 0; background: none; padding: 10px 12px; }
.row-head:hover { background: var(--bg-hover); }
.row-head .dot { margin-top: 5px; }
.row-main { flex: 1; min-width: 0; }
.row-kind { font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-3); font-weight: 500; }
.row-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-title { color: var(--text-2); font-size: 11px; }
.badge { font-size: 10px; background: var(--bg-2); color: var(--text-2); border-radius: 4px; padding: 1px 5px; white-space: nowrap; }
.chev { color: var(--text-3); transition: transform 0.15s; }
.row.open .chev { transform: rotate(90deg); }
.row.applied .row-text { text-decoration: none; color: var(--text-2); }
.applied-tag { color: var(--success); font-size: 11px; font-weight: 500; }

/* Card */
.card { padding: 0 12px 12px 27px; }
.issue { margin-bottom: 10px; }
.issue-title { display: flex; gap: 6px; align-items: center; font-weight: 500; }
.sev { font-size: 10px; font-weight: 500; text-transform: capitalize; border-radius: 4px; padding: 0 5px; }
.sev.critical { color: var(--sev-critical); background: color-mix(in srgb, var(--sev-critical) 12%, transparent); }
.sev.high { color: var(--sev-high); background: color-mix(in srgb, var(--sev-high) 12%, transparent); }
.sev.medium { color: #b27b00; background: color-mix(in srgb, var(--sev-medium) 18%, transparent); }
.sev.low { color: var(--text-2); background: var(--bg-2); }
.issue p { margin: 2px 0 0; color: var(--text-2); }
.guide-ref { font-size: 10px; color: var(--text-3); margin-top: 2px; }

.diff { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin: 10px 0; }
.diff > div { padding: 7px 9px; white-space: pre-wrap; word-break: break-word; }
.diff .before { background: var(--bg-2); color: var(--text-2); }
.diff .after { border-top: 1px solid var(--border); }
.diff .lbl { display: block; font-size: 10px; color: var(--text-3); margin-bottom: 2px; }
del { color: var(--danger); background: var(--danger-bg); text-decoration: line-through; }
ins { color: var(--success); background: var(--success-bg); text-decoration: none; font-weight: 500; }

.note { font-size: 11px; color: var(--warning); margin: 4px 0; }
.note.bad { color: var(--danger); }
.alts { display: flex; gap: 4px; flex-wrap: wrap; margin: 6px 0; }
.alts button { border: 1px dashed var(--border); background: none; border-radius: 4px; padding: 2px 6px; font-size: 11px; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
textarea { width: 100%; min-height: 60px; resize: vertical; border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; background: var(--bg); }
textarea:focus, input:focus { outline: 2px solid var(--brand); outline-offset: -1px; }

.group-label { padding: 10px 12px 4px; font-size: 11px; font-weight: 500; color: var(--text-2); }
details.possible summary { padding: 10px 12px; cursor: pointer; color: var(--text-2); font-size: 11px; }

/* Footer */
.footer { border-top: 1px solid var(--border); padding: 8px 12px; display: flex; align-items: center; gap: 8px; flex: none; }
.footer .muted { margin-left: auto; font-size: 11px; }

/* All clear */
.clear { padding: 24px 16px; text-align: center; }
.clear h2 { font-size: 14px; margin: 8px 0 4px; }
.checks { list-style: none; padding: 0; margin: 16px 0 0; text-align: left; }
.checks li { display: flex; gap: 8px; padding: 4px 0; }
.checks .ok { color: var(--success); }
.checks .no { color: var(--danger); }

/* Rules */
.field { margin-bottom: 14px; }
.field label { display: block; font-weight: 500; margin-bottom: 4px; }
.field .hint { font-size: 11px; color: var(--text-2); margin-bottom: 6px; }
input[type="text"] { width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; background: var(--bg); }

.error-banner { margin: 12px; padding: 8px 10px; border-radius: 6px; background: var(--danger-bg); color: var(--danger); font-size: 11px; }
</style>
